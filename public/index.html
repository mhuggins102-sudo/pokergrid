<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>PokerGrid</title>

    <!--
      Match the in-app dark background everywhere the OS / browser chrome
      colors itself from the page:

        - theme-color   → modern browsers' chrome tint (Safari URL bar on iOS,
                          Chrome top bar on Android). Without it the bar
                          renders white above our dark canvas.
        - apple-mobile-web-app-capable + apple-mobile-web-app-status-bar-style
                        → "Add to Home Screen" PWA on iOS. black-translucent
                          renders the status bar transparently over the page
                          so the body background (also #06070d) shows through
                          and there's no white slab at the top of the phone.
    -->
    <meta name="theme-color" content="#06070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokerGrid" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Icons served from public/ — Expo's web build copies the public/
      folder verbatim to the served root. The `sizes` hints let each
      surface (browser tab, bookmark, iOS Home Screen, Android PWA)
      pick the right rendition without downscaling artifacts.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      /*
        Lock the page to the (dynamic) viewport so the app's flex: 1
        root actually fills the available height on mobile web.

        Cascade is intentional — each line overrides the previous on
        browsers that support it:
          - 100vh: fallback for older browsers
          - 100dvh: modern dynamic viewport (URL bar collapse)
          - -webkit-fill-available: iOS-only fallback. On most surfaces
            this is enough, but in iOS PWA standalone mode it can
            still report a stale viewport on the very first paint —
            the bottom home-indicator zone gets settled a frame or
            two AFTER mount, and any content tall enough to brush
            the bottom edge surfaces a dark band until the user
            scrolls.
          - var(--app-h): set by the script below from
            window.visualViewport.height (authoritative on iOS) and
            re-applied on every visualViewport resize. This is the
            line that actually fills the viewport when the simpler
            fallbacks underreport.
      */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        height: -webkit-fill-available;
        height: var(--app-h, 100dvh);
        background-color: #06070d;
        color-scheme: dark;
      }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        /* Prevent body-level scroll / rubber-band. Internal RN-Web
           ScrollViews render their own scroll containers, so this only
           kills the global bounce that, on iOS PWA, briefly reveals a
           dark band below the app when the user swipes. */
        overflow: hidden;
      }
    </style>

    <script>
      // iOS PWA-mode viewport height fix. window.visualViewport.height
      // is the authoritative "actual visible viewport" API and updates
      // synchronously when the home-indicator zone settles, so we
      // mirror it onto --app-h for the CSS height cascade above. The
      // requestAnimationFrame double-tap catches the 1–2-frame lag
      // some iOS versions show between first paint and the
      // visualViewport reporting the post-settle value.
      (function () {
        var root = document.documentElement;
        function apply() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          if (h) root.style.setProperty('--app-h', h + 'px');
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
        }
        requestAnimationFrame(function () {
          apply();
          requestAnimationFrame(apply);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
